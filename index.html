<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matriz de prioridades</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --ink:#222; --muted:#666; --card:#ffffffcc; --line:#e9c84e;
  --axis:#6f6f6f; --axis-ink:#fff;
  --a-bg:#c6efdc; --a-ink:#0f6e32;
  --p-bg:#fffcb8; --p-ink:#8a6d00;
  --d-bg:#fde5b0; --d-ink:#b8500a;
  --e-bg:#fdd6d6; --e-ink:#b8101a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191a1c; --ink:#eee; --muted:#a8a8a8; --card:#0000002e; --line:#a88c22;
    --axis:#3d3d3f; --axis-ink:#f1f1f1;
    --a-bg:#17382a; --a-ink:#5fd68e;
    --p-bg:#3a3716; --p-ink:#e6cc4a;
    --d-bg:#3d2c14; --d-ink:#f39a4c;
    --e-bg:#3d1f21; --e-ink:#ff6b70;
  }
}
:root[data-theme="dark"]{
  --bg:#191a1c; --ink:#eee; --muted:#a8a8a8; --card:#0000002e; --line:#a88c22;
  --axis:#3d3d3f; --axis-ink:#f1f1f1;
  --a-bg:#17382a; --a-ink:#5fd68e;
  --p-bg:#3a3716; --p-ink:#e6cc4a;
  --d-bg:#3d2c14; --d-ink:#f39a4c;
  --e-bg:#3d1f21; --e-ink:#ff6b70;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
h1{font-family:"Gochi Hand","Comic Sans MS",cursive;font-size:2rem;margin:0 0 2px;font-weight:400}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.add input,.add select,.add button{font:inherit;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.add input{flex:1 1 220px;min-width:0}
.add button{background:var(--axis);color:var(--axis-ink);border-color:var(--axis);font-weight:800;cursor:pointer}
:focus-visible{outline:3px solid #2b7de9;outline-offset:2px}
.grid{display:grid;grid-template-columns:42px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:6px;background:var(--line);padding:6px;border-radius:6px}
.ax{background:var(--axis);color:var(--axis-ink);font-weight:800;display:flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:.03em;padding:10px 6px;text-align:center}
.ax.row{writing-mode:vertical-rl;transform:rotate(180deg)}
.corner{background:var(--bg)}
.q{padding:14px;min-height:230px;display:flex;flex-direction:column;transition:outline-color .15s;outline:3px solid transparent;outline-offset:-3px}
.q.over{outline-color:var(--ink)}
.q h2{font-family:"Gochi Hand","Comic Sans MS",cursive;font-weight:400;font-size:1.9rem;margin:0;line-height:1.1}
.q .hint{font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.qa{background:var(--a-bg)} .qa h2{color:var(--a-ink)}
.qp{background:var(--p-bg)} .qp h2{color:var(--p-ink)}
.qd{background:var(--d-bg)} .qd h2{color:var(--d-ink)}
.qe{background:var(--e-bg)} .qe h2{color:var(--e-ink)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1}
li{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:4px 10px;background:var(--card);border-radius:10px;padding:10px;cursor:grab}
.meta{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tx{word-break:break-word;font-size:1.02rem;font-weight:600;line-height:1.3}
li input[type=checkbox]{margin-top:2px}
li input[type=time]{font:inherit;font-size:.8rem;width:92px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:2px}
li.done .tx{text-decoration:line-through;opacity:.6}

li input[type=checkbox]{width:20px;height:20px;accent-color:var(--axis);flex:none}
li select{font:inherit;font-size:.85rem;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:3px}
li button{border:0;background:transparent;color:var(--ink);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:6px}
.empty{color:var(--muted);font-size:.9rem;font-style:italic;padding:6px 2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.9rem}
.foot button{font:inherit;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
@media (max-width:640px){
  .grid{grid-template-columns:1fr;grid-template-rows:none}
  .ax,.corner{display:none}
  .q{min-height:150px}
}
.add input[type=date]{flex:0 1 150px}
.cal{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead strong{flex:1;text-align:center;font-family:"Gochi Hand","Comic Sans MS",cursive;font-size:1.5rem;font-weight:400}
.calhead button{font:inherit;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-weight:800;font-size:.8rem;color:var(--muted);padding:2px 0}
.day{font:inherit;min-height:52px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.day.blank{border:0;cursor:default}
.day.today{background:var(--axis);color:var(--axis-ink);border-color:var(--axis)}
.day.sel{outline:3px solid #2b7de9;outline-offset:-2px}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%}
.dot.a{background:var(--a-ink)}.dot.p{background:var(--p-ink)}.dot.d{background:var(--d-ink)}.dot.e{background:var(--e-ink)}
.dayl{margin-top:10px}
.dayl h3{margin:0 0 6px;font-size:1rem}
.dayl .it{display:flex;gap:8px;align-items:center;padding:4px 0}
.chip{font-size:.75rem;padding:1px 7px;border-radius:10px;background:var(--bg);white-space:nowrap}
.chip.late{background:var(--e-bg);color:var(--e-ink);font-weight:800}
.add input[type=time]{flex:0 1 120px}
#alarm{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.al{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--e-bg);border:2px solid var(--e-ink);border-radius:10px;padding:10px;margin-bottom:8px}
.al strong{flex:1 1 100%}
.al button,#notif,#snd{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
#notif,#snd{margin:0 8px 12px 0}
.add{align-items:flex-end}
.add input#txt{flex:1 1 100%}
.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
.add .f input,.add .f select{flex:none;width:auto;min-width:0;font-weight:400;color:var(--ink)}
.chip{font-size:.82rem;font-weight:600}
.dot.x{opacity:.35}
.hrow{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.hrow .nm{flex:1 1 100%;font-weight:600}
.sq{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
.sq.on{background:var(--a-ink);border-color:var(--a-ink)}
.hrow .n{color:var(--muted);font-size:.85rem;margin-left:4px}
.sum{margin:4px 0 6px;font-weight:600}
@keyframes flash{0%,100%{background:var(--card);box-shadow:0 0 0 0 transparent}50%{background:#ffd23f;color:#111;box-shadow:0 0 14px 4px #ff9f1a}}
@keyframes edge{from{opacity:1}to{opacity:0.1}}
li.flash{animation:flash 1s infinite;outline:2px solid #ff9f1a}
.al{animation:flash 1s infinite}
body.ringing::after{content:"";position:fixed;inset:0;pointer-events:none;border:12px solid #ff2d2d;z-index:50;animation:edge .6s infinite alternate}
@media (prefers-reduced-motion:reduce){li.flash,.al,body.ringing::after{animation:none}}
.q .hint{font-size:.88rem}
@media (max-width:640px){.day{min-height:44px}}
:root{--bg:#f5f1e8;--ink:#1d1b16;--muted:#6f6857;--card:#ffffffb8;--line:#d6c183;--axis:#1f2430;--axis-ink:#f3e7c0;--glow:#f0e2b8aa;
  --a-bg:#e1f0e6;--a-ink:#1f6b45;--p-bg:#f6eed0;--p-ink:#876510;--d-bg:#f7e5d0;--d-ink:#a4531a;--e-bg:#f4dada;--e-ink:#a3262b;--gold:#c9a24a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--ink:#f1ece0;--muted:#9a9484;--card:#ffffff0d;--line:#5e4d24;--axis:#1a1d26;--axis-ink:#e8cf8a;--glow:#3a2f1288;
  --a-bg:#12241c;--a-ink:#62d99a;--p-bg:#262011;--p-ink:#e8c860;--d-bg:#2a1d12;--d-ink:#f0a15a;--e-bg:#2a1517;--e-ink:#ff7378}}
:root[data-theme="dark"]{--bg:#0e1015;--ink:#f1ece0;--muted:#9a9484;--card:#ffffff0d;--line:#5e4d24;--axis:#1a1d26;--axis-ink:#e8cf8a;--glow:#3a2f1288;
  --a-bg:#12241c;--a-ink:#62d99a;--p-bg:#262011;--p-ink:#e8c860;--d-bg:#2a1d12;--d-ink:#f0a15a;--e-bg:#2a1517;--e-ink:#ff7378}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1100px 480px at 50% -8%,var(--glow),transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:1040px;padding:30px 16px 60px}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.28em;color:var(--gold);margin-bottom:6px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:2.5rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.sub{font-size:.95rem;margin-bottom:20px}
.add{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 18px 40px -28px #000;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.add input,.add select{border:1px solid var(--line);border-radius:12px;background:transparent;padding:11px 13px}
.add button{background:linear-gradient(135deg,#ecd58f,#b8923a);color:#1a1405;border:0;border-radius:12px;font-weight:700;letter-spacing:.02em;padding:12px 20px;box-shadow:0 8px 20px -10px #b8923a}
.f{letter-spacing:.08em;text-transform:uppercase;font-size:.68rem}
#snd,#notif{border-radius:999px;font-size:.85rem;padding:7px 16px;border-color:var(--line)}
.grid{background:transparent;padding:0;gap:14px;border-radius:0}
.corner{background:transparent}
.ax{background:transparent;color:var(--muted);font-size:.7rem;letter-spacing:.22em;font-weight:700}
.q{border-radius:22px;border:1px solid var(--line);padding:20px;box-shadow:0 22px 44px -32px #000}
.q.qa{background:linear-gradient(155deg,var(--a-bg),color-mix(in srgb,var(--a-bg) 55%,var(--bg)))}
.q.qp{background:linear-gradient(155deg,var(--p-bg),color-mix(in srgb,var(--p-bg) 55%,var(--bg)))}
.q.qd{background:linear-gradient(155deg,var(--d-bg),color-mix(in srgb,var(--d-bg) 55%,var(--bg)))}
.q.qe{background:linear-gradient(155deg,var(--e-bg),color-mix(in srgb,var(--e-bg) 55%,var(--bg)))}
.q h2{font-family:"Playfair Display",Georgia,serif;font-size:1.55rem;font-weight:700;display:flex;align-items:center}
.cnt{font-family:Inter,sans-serif;font-size:.72rem;font-weight:700;margin-left:10px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;opacity:.85}
.q .hint{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;margin:4px 0 14px}
.cal{border-radius:22px;border:1px solid var(--line);padding:20px;box-shadow:0 22px 44px -32px #000}
.calhead strong{font-family:"Playfair Display",Georgia,serif;font-size:1.4rem;font-weight:700}
.calhead button,.foot button{border-radius:999px;border:1px solid var(--line)}
.day{border-radius:12px;border:1px solid transparent}
.day:hover{border-color:var(--line)}
.day.today{background:linear-gradient(135deg,#ecd58f,#b8923a);color:#1a1405;border-color:transparent;font-weight:700}
.day.sel{outline:2px solid var(--gold);outline-offset:-2px}
.dot{width:7px;height:7px}
.dayl h3{font-family:"Playfair Display",Georgia,serif;font-size:1.1rem}
#chart svg rect[style]{fill:var(--gold)!important}
.sq{border-radius:8px}.sq.on{background:var(--gold);border-color:var(--gold)}
.sum{font-size:.95rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--axis);color:var(--axis-ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px -10px #000}
#toast button{font:inherit;font-weight:700;background:var(--gold);color:#1a1405;border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
li button.permdel{font-size:.74rem;font-weight:600;border:1px solid var(--e-ink);color:var(--e-ink);border-radius:999px;padding:3px 10px}
.ov{position:fixed;inset:0;background:#000b;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:0 30px 60px -20px #000}
.mb h3{font-family:"Playfair Display",Georgia,serif;font-size:1.3rem;margin:0 0 8px}
.mb p{margin:0 0 18px;color:var(--muted)}
.mbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mbtn .btn{font:inherit;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
.mbtn .btn.danger{background:var(--e-ink);border-color:var(--e-ink);color:#fff}
.mb textarea{width:100%;font:12px ui-monospace,monospace;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:12px}
.more{font:inherit;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">MATRIZ DE EISENHOWER</div>
  <h1>Mis prioridades</h1>
  <p class="sub">Escribe una tarea, elige su cuadrante y arrastra o muévela cuando cambie.</p>

  <div class="add">
    <input id="txt" type="text" maxlength="140" placeholder="Nueva tarea" aria-label="Nueva tarea">
    <label class="f">Cuadrante<select id="sel">
      <option value="a">¡Actúa ya!</option>
      <option value="p">Planifica</option>
      <option value="d">Delega</option>
      <option value="e">¡Elimina!</option>
    </select></label>
    <label class="f">Fecha<input id="dt" type="date"></label>
    <label class="f">Hora<input id="tm" type="time"></label>
    <label class="f">Repetir<select id="rc"><option value="">Una vez</option><option value="d">Todos los días</option><option value="w">Cada semana</option></select></label>
    <button id="btn">Agregar tarea</button>
  </div>

  <button id="snd">🔊 Probar sonido</button>
  <button id="notif" hidden>🔔 Activar avisos del navegador</button>
  <div id="alarm" aria-live="assertive"></div>

  <div class="grid">
    <div class="corner"></div>
    <div class="ax">URGENTE</div>
    <div class="ax">NO URGENTE</div>
    <div class="ax row">IMPORTANTE</div>
    <div class="q qa" data-q="a"></div>
    <div class="q qp" data-q="p"></div>
    <div class="ax row">NO IMPORTANTE</div>
    <div class="q qd" data-q="d"></div>
    <div class="q qe" data-q="e"></div>
  </div>

  <div class="cal" id="cal"></div>
  <div class="cal" id="chart"></div>

  <div class="foot">
    <span id="count"></span>
    <button id="backup">Copia de seguridad</button> <button id="restore">Restaurar hábitos</button> <button id="clear">Borrar completadas</button>
  </div>
</div>

<script>
var META={
  a:{t:"¡Actúa ya!",h:"Importante y urgente",i:"🏃"},
  p:{t:"Planifica",h:"Importante, no urgente",i:"📅"},
  d:{t:"Delega",h:"Urgente, no importante",i:"👥"},
  e:{t:"¡Elimina!",h:"Ni urgente ni importante",i:"🗑️"}
};
var KEY="matriz-prioridades-v1";
var tasks=[];
try{var raw=localStorage.getItem(KEY);if(raw)tasks=JSON.parse(raw)||[];}catch(e){tasks=[];}
function cleanTasks(a){if(!Array.isArray(a))return [];var D=/^\d{4}-\d{2}-\d{2}$/;return a.filter(function(t){return t&&typeof t==="object"&&typeof t.text==="string"&&t.text.trim()&&["a","p","d","e"].indexOf(t.q)>-1;}).map(function(t,i){return {id:String(t.id||("t"+Date.now()+i)),text:t.text.slice(0,140),q:t.q,rec:t.rec==="d"||t.rec==="w"?t.rec:"",doneOn:typeof t.doneOn==="string"?t.doneOn:"",snooze:typeof t.snooze==="string"?t.snooze:"",date:D.test(t.date||"")?t.date:"",time:/^\d{2}:\d{2}$/.test(t.time||"")?t.time:"",alarmed:!!t.alarmed,done:!!t.done,log:Array.isArray(t.log)?t.log.filter(function(x){return D.test(x);}).slice(-400):[]};});}
tasks=cleanTasks(tasks);
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){}}

function el(tag,props,kids){
  var n=document.createElement(tag);
  for(var k in (props||{})){ if(k==="text")n.textContent=props[k]; else n[k]=props[k]; }
  (kids||[]).forEach(function(c){n.appendChild(c);});
  return n;
}

function render(){ensureHabits();pruneBanners();
  document.querySelectorAll(".q").forEach(function(box){
    var q=box.dataset.q, m=META[q];
    box.innerHTML="";
    var h2=el("h2",{text:m.t});h2.appendChild(el("span",{className:"cnt",text:String(tasks.filter(function(t){return t.q===q&&!isDone(t);}).length)}));box.appendChild(h2);
    box.appendChild(el("div",{className:"hint",text:m.h}));
    var ul=el("ul");
    var mine=tasks.filter(function(t){return t.q===q&&!(t.rec&&isDone(t));});
    if(!mine.length) ul.appendChild(el("div",{className:"empty",text:"Suelta una tarea aquí."}));
    var total=mine.length;mine=mine.filter(function(t){return !isDone(t);}).concat(mine.filter(function(t){return isDone(t);})).slice(0,LIM[q]||50);
    mine.forEach(function(t){
      var li=el("li",{className:(isDone(t)?"done":"")+((t.q==="a"||t.q==="d")&&!isDone(t)&&t.date===todayISO()&&(t.time||"99")<"12:00"?" flash":""),draggable:true});
      li.addEventListener("dragstart",function(ev){ev.dataTransfer.setData("text/plain",t.id);});
      var cb=el("input",{type:"checkbox",checked:isDone(t)});
      cb.setAttribute("aria-label","Completar");
      cb.addEventListener("change",function(){if(t.rec){markDone(t,cb.checked);}else{t.done=cb.checked;}save();render();});
      var sel=el("select");
      sel.setAttribute("aria-label","Mover a otro cuadrante");
      for(var k in META){
        var o=el("option",{value:k,text:META[k].t.replace(/[¡!]/g,"")});
        if(k===t.q)o.selected=true;
        sel.appendChild(o);
      }
      sel.addEventListener("change",function(){t.q=sel.value;save();render();});
      var fx=isFixed(t);var del=el("button",{text:fx?"🔒 Borrar permanentemente":"✕",className:fx?"permdel":""});
      del.setAttribute("aria-label","Eliminar tarea");
      del.addEventListener("click",function(){if(fx){confirmPerm(t);return;}var idx=tasks.indexOf(t);tasks=tasks.filter(function(x){return x!==t;});save();render();showUndo(t,idx);});
      var meta=el("div",{className:"meta"});li.appendChild(cb);li.appendChild(el("span",{className:"tx",text:t.text}));li.appendChild(meta);
      if(t.date){var late=!t.rec&&!isDone(t)&&t.date<todayISO();meta.appendChild(el("span",{className:"chip"+(late?" late":""),text:(t.rec==="d"?"Diaria · ":t.rec==="w"?"Semanal · ":"")+(late?"Vencida ":"")+fmt(t.date)}));}
      var ti=el("input",{type:"time",value:t.time||""});ti.setAttribute("aria-label","Hora del aviso");
      ti.addEventListener("change",function(){if(!ti.value){render();return;}t.time=ti.value;if(!t.date)t.date=todayISO();t.alarmed=false;t.snooze="";save();render();});
      meta.appendChild(ti);
      meta.appendChild(sel);meta.appendChild(del);
      ul.appendChild(li);
    });

function pad(n){return String(n).padStart(2,"0");}
var AL;
function markDone(t,on){var td=todayISO(),lg=(t.log||[]).filter(function(d){return d!==td;});if(on){lg.push(td);t.doneOn=td;}else{t.doneOn="";}t.log=lg.slice(-400);}
function tasksOn(key){var td=todayISO(),out=[];tasks.forEach(function(t){if(t.rec==="d"){var lg=t.log||[];if(key<td){if(lg.indexOf(key)>-1)out.push({t:t,done:true});}else if(key===td){out.push({t:t,done:isDone(t)});}else{out.push({t:t,done:false});}}else if(t.date===key){out.push({t:t,done:isDone(t)});}});return out;}
function nowKey(){var n=new Date();return iso(n.getFullYear(),n.getMonth(),n.getDate())+" "+pad(n.getHours())+":"+pad(n.getMinutes());}
function weekStart(s){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d.getFullYear(),d.getMonth(),d.getDate());}
function isDone(t){if(!t.rec)return !!t.done;if(!t.doneOn)return false;var td=todayISO();return t.rec==="d"?t.doneOn===td:weekStart(t.doneOn)===weekStart(td);}
function advance(t){var step=t.rec==="w"?7:1,key=nowKey(),d=new Date(t.date+"T00:00:00"),g=0;do{d.setDate(d.getDate()+step);t.date=iso(d.getFullYear(),d.getMonth(),d.getDate());g++;}while((t.date+" "+t.time)<=key&&g<800);t.alarmed=false;}
function nextOcc(time){var td=todayISO();if(td+" "+time>nowKey())return td;var d=new Date();d.setDate(d.getDate()+1);return iso(d.getFullYear(),d.getMonth(),d.getDate());}
function alarmFor(){
  var dv=document.getElementById("dt").value,tv=document.getElementById("tm").value;

}
function beep(){unlock();if(!actx)return;var t0=actx.currentTime;for(var i=0;i<4;i++){tone(1500,t0+i*0.26,0.18);}}
var actx=null,alarmTimer=null;
function unlock(){try{var C=window.AudioContext||window.webkitAudioContext;if(!actx)actx=new C();if(actx.state==="suspended")actx.resume();}catch(e){}}
["click","touchstart","keydown"].forEach(function(ev){document.addEventListener(ev,unlock);});
var master=null;
function out(){if(!master){var m=actx.createGain();m.gain.value=3;var c=actx.createDynamicsCompressor();c.threshold.value=-6;c.knee.value=0;c.ratio.value=20;c.attack.value=0.001;c.release.value=0.05;m.connect(c);c.connect(actx.destination);master=m;}return master;}
function tone(f,at,d){[f,f*1.33].forEach(function(fr){var o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=fr;g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(1,at+0.005);g.gain.setValueAtTime(1,at+d-0.01);g.gain.exponentialRampToValueAtTime(0.0001,at+d);o.connect(g);g.connect(out());o.start(at);o.stop(at+d+0.02);});}
function startAlarm(){stopAlarm();document.body.classList.add("ringing");beep();var n=0;alarmTimer=setInterval(function(){beep();if(++n>=60)stopAlarm();},1500);}

    s+='<text x="'+(x+bw/2)+'" y="'+(base+20)+'" text-anchor="middle" font-size="13" style="fill:var(--muted)">'+(k===td?'Hoy':parseInt(k.slice(8),10))+'</text>';
  });
